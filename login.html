<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · MARISENTINEL Coastal Security</title>
  <meta name="description" content="Role-based access to the maritime intelligence command platform.">
  
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link rel="icon" type="image/x-icon" href="public/favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

  <style>
    @keyframes liquid-shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes liquid-card-float {
      0%, 100% { translate: 0 0px; }
      50% { translate: 0 -6px; }
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b1120;
      position: relative;
      padding: 24px;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }

    .liquid-login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 40px 36px;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.68) 0%, rgba(255, 255, 255, 0.35) 50%, rgba(255, 255, 255, 0.55) 100%);
      background-size: 200% 200%;
      animation: liquid-shimmer 10s ease infinite, liquid-card-float 5s ease-in-out infinite;
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-top: 1.8px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 24px 64px 0 rgba(15, 23, 42, 0.3),
        inset 0 2px 4px 0 rgba(255, 255, 255, 0.85);
    }

    .liquid-brand-box {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.4) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-top: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #0f172a;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12), inset 0 1px 2px rgba(255, 255, 255, 0.9);
    }

    .liquid-input {
      background: rgba(255, 255, 255, 0.75) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(255, 255, 255, 0.8) !important;
      border-radius: 8px !important;
      color: #0f172a !important;
      font-weight: 500 !important;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04) !important;
      transition: all 0.2s ease !important;
    }

    .liquid-input:focus {
      background: rgba(255, 255, 255, 0.95) !important;
      border-color: #0284c7 !important;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.25) !important;
    }

    .liquid-submit-btn {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      border-radius: 8px !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.4) !important;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    .liquid-submit-btn:hover {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;
      transform: translateY(-1.5px) !important;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.5) !important;
    }
  </style>
</head>
<body>
  
  <div class="liquid-login-card">
    
    <!-- Brand -->
    <div style="display: flex; justify-content: center; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="liquid-brand-box">⚓</div>
        <div>
          <span style="font-size: 18px; font-weight: 800; letter-spacing: 0.08em; color: #0f172a; display: block; text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);">
            MARISENTINEL
          </span>
          <span style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: #334155; text-shadow: 0 1px 1px rgba(255, 255, 255, 0.7);">
            Autonomous Maritime Intelligence
          </span>
        </div>
      </div>
    </div>

    <!-- Header -->
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 24px; font-weight: 800; color: #0f172a; text-shadow: 0 1px 2px rgba(255, 255, 255, 0.85);">Secure Sign In</h1>
      <p style="font-size: 14px; font-weight: 500; color: #334155; margin-top: 4px; text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);">Authorized coastal security personnel only.</p>
    </div>

    <!-- Error / Status message box -->
    <div id="error-box" class="badge badge-danger" style="display: none; width: 100%; padding: 10px; margin-bottom: 16px; border-radius: var(--radius-md); font-size: 14px; text-transform: none;">
      <span id="error-msg"></span>
    </div>

    <!-- Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="role-select" style="font-weight: 700; color: #0f172a; text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);">Select Role</label>
        <select id="role-select" class="select-field liquid-input">
          <option value="">Choose a role...</option>
          <option value="administrator">Administrator</option>
          <option value="command">Command Officer</option>
          <option value="field">Field Officer</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="username-input" style="font-weight: 700; color: #0f172a; text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);">Username or email</label>
        <input type="text" id="username-input" class="input-field liquid-input" placeholder="Username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password-input" style="font-weight: 700; color: #0f172a; text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);">Password</label>
        <input type="password" id="password-input" class="input-field liquid-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="submit-btn" class="btn liquid-submit-btn" style="width: 100%; padding: 14px; margin-top: 12px; font-size: 16px;">
        Sign In &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
      <a href="index.html" style="font-size: 14px; font-weight: 600; color: #1e293b; text-decoration: none; transition: all 0.2s; text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);">
        &larr; Back to overview
      </a>
    </div>

  </div>

  <script src="js/bg-animation.js"></script>
  <script src="js/services/ruleEngine.js?v=3.1"></script>
  <script src="js/services/riskEngine.js?v=3.1"></script>
  <script src="js/services/threatEngine.js?v=3.1"></script>
  <script src="js/services/fusionService.js?v=3.1"></script>
  <script src="js/store.js?v=3.1"></script>
  <script src="js/ui.js?v=3.1"></script>
  <script>
    const roleSelect = document.getElementById("role-select");
    const usernameInput = document.getElementById("username-input");
    const passwordInput = document.getElementById("password-input");
    const loginForm = document.getElementById("login-form");
    const errorBox = document.getElementById("error-box");
    const errorMsg = document.getElementById("error-msg");
    const submitBtn = document.getElementById("submit-btn");

    // Autofill on role selection
    roleSelect.addEventListener("change", (e) => {
      const selectedRole = e.target.value;
      errorBox.style.display = "none";
      if (selectedRole === "administrator") {
        usernameInput.value = "admin";
        passwordInput.value = "admin123";
      } else if (selectedRole === "command") {
        usernameInput.value = "command";
        passwordInput.value = "command123";
      } else if (selectedRole === "field") {
        usernameInput.value = "field";
        passwordInput.value = "field123";
      }
    });

    // Form submit
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      errorBox.style.display = "none";

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const role = roleSelect.value;

      if (!username || !password) {
        errorMsg.textContent = "Please enter both username and password.";
        errorBox.style.display = "flex";
        return;
      }

      // Instant zero-delay authentication
      const res = window.msStore ? window.msStore.login(username, password, role) : { ok: false };

      if (!res.ok) {
        errorMsg.textContent = res.error || "Authentication failed.";
        errorBox.style.display = "flex";
        return;
      }

      // Take action immediately with zero wait time
      if (res.role === "administrator") {
        window.location.replace("admin.html");
      } else if (res.role === "command") {
        window.location.replace("command.html");
      } else if (res.role === "field") {
        window.location.replace("field.html");
      } else {
        window.location.replace("command.html");
      }
    });
  </script>
</body>
</html>
