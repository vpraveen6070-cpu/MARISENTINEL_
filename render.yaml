services:
  # 1. Backend: Python Flask ML Inference & Hybrid AI API
  - type: web
    name: marisentinel-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8

  # 2. Frontend: Maritime Command & Field Operations Web Application
  - type: web
    name: marisentinel-web
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
