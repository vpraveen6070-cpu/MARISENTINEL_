<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center · MARISENTINEL</title>
  <meta name="description" content="Real-time maritime threat picture for command officers.">
  
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link rel="icon" type="image/x-icon" href="public/favicon.ico">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <div id="shell-sidebar-slot"></div>

    <div class="app-main">
      <div id="shell-header-slot"></div>

      <main class="app-content" id="command-view-container">
        <!-- Dynamic Subviews -->
      </main>
    </div>
  </div>

  <!-- Dispatch & Confirm Alert Modal -->
  <div id="dispatch-modal" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Confirm Threat & Dispatch Field Officer</h3>
        <button class="toast-close" onclick="document.getElementById('dispatch-modal').classList.remove('open')">&times;</button>
      </div>
      <form id="dispatch-form">
        <input type="hidden" id="dispatch-alert-id" />
        <div class="modal-body">
          <div style="background:var(--bg-card-subtle); padding:12px; border-radius:var(--radius-md); margin-bottom:14px; border:1px solid var(--border-color);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong id="dispatch-alert-title" style="font-size:16px;">Threat Alert</strong>
              <span id="dispatch-alert-risk" class="badge badge-critical">Critical</span>
            </div>
            <p id="dispatch-alert-desc" style="font-size:14px; color:var(--text-muted); margin-top:4px;">Zone & Vessel info</p>
          </div>

          <div class="form-group">
            <label class="form-label">Select Field Unit / Interceptor Officer</label>
            <select id="dispatch-officer-select" class="select-field" required>
              <!-- Dynamic Officers populated on open -->
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Mission Directive & Field Instructions</label>
            <input type="text" id="dispatch-directive" class="input-field" value="Intercept contact, verify AIS discrepancy, and secure sector perimeter." required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('dispatch-modal').classList.remove('open')">Cancel</button>
          <button type="submit" class="btn btn-primary">Confirm & Deploy Unit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Manual Incident Creation Modal -->
  <div id="incident-modal" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Log & Dispatch Tactical Incident</h3>
        <button class="toast-close" onclick="document.getElementById('incident-modal').classList.remove('open')">&times;</button>
      </div>
      <form id="incident-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Incident Title</label>
            <input type="text" id="new-inc-title" class="input-field" placeholder="e.g. Unidentified vessel loitering near refinery SPM" required />
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Category</label>
              <select id="new-inc-cat" class="select-field">
                <option value="Security Intrusion">Security Intrusion</option>
                <option value="AIS Blackout / Smuggling">AIS Blackout / Smuggling</option>
                <option value="Unauthorized Loitering">Unauthorized Loitering</option>
                <option value="Search & Rescue">Search & Rescue</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Contact / Vessel Name</label>
              <input type="text" id="new-inc-vessel" class="input-field" placeholder="e.g. Unknown Contact #42" required />
            </div>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Risk Severity Level</label>
              <select id="new-inc-level" class="select-field">
                <option value="Critical">Critical (85–100)</option>
                <option value="High">High (65–80)</option>
                <option value="Elevated">Elevated (45–60)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Assign Field Officer</label>
              <select id="new-inc-officer" class="select-field" required>
                <!-- Populated dynamically -->
              </select>
            </div>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Latitude (°N)</label>
              <input type="number" step="0.01" id="new-inc-lat" class="input-field" value="17.65" required />
            </div>
            <div class="form-group">
              <label class="form-label">Longitude (°E)</label>
              <input type="number" step="0.01" id="new-inc-lng" class="input-field" value="83.35" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Operational Briefing</label>
            <input type="text" id="new-inc-desc" class="input-field" placeholder="Brief situational description and required evidence." required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('incident-modal').classList.remove('open')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create & Dispatch</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Vessel Detail Intelligence Modal -->
  <div id="vessel-modal" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="vessel-modal-title">Vessel Intelligence Profile</h3>
        <button class="toast-close" onclick="document.getElementById('vessel-modal').classList.remove('open')">&times;</button>
      </div>
      <div class="modal-body" id="vessel-modal-body">
        <!-- Dynamic Vessel Telemetry -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('vessel-modal').classList.remove('open')">Close</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/services/ruleEngine.js"></script>
  <script src="js/services/riskEngine.js"></script>
  <script src="js/services/threatEngine.js"></script>
  <script src="js/services/fusionService.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/map.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await window.msStore.ready;
      const { sidebarHtml, headerHtml } = window.MS_UI.renderAppShell("command", "overview");
      document.getElementById("shell-sidebar-slot").outerHTML = sidebarHtml;
      document.getElementById("shell-header-slot").outerHTML = headerHtml;

      let currentTab = "overview";

      // =========================================================================
      // DYNAMIC & INTERACTIVE ANALYTICS ENGINE
      // =========================================================================
      let analyticsMode = "threats"; // "threats" | "all"
      let analyticsCategoryFilter = null; // category string or null
      let analyticsHoveredCategory = null;

      const THREAT_COLORS = {
        "Dark Activity / Smuggling": "#ef4444",
        "Border Intrusion": "#f97316",
        "Illegal Fishing": "#eab308",
        "Suspicious Loitering": "#0284c7",
        "Anomalous Behavior": "#8b5cf6",
        "Normal Transit": "#10b981",
        "High Threat Intrusion": "#dc2626",
        "Other / Unclassified": "#64748b"
      };

      const RISK_TIERS = [
        { id: "low", label: "Low Risk (0–40)", color: "var(--secondary)", hex: "#10b981", min: 0, max: 40 },
        { id: "elevated", label: "Elevated (41–60)", color: "var(--status-warn)", hex: "#f59e0b", min: 41, max: 60 },
        { id: "high", label: "High Risk (61–80)", color: "var(--status-danger)", hex: "#f97316", min: 61, max: 80 },
        { id: "critical", label: "Critical (81–100)", color: "var(--tertiary)", hex: "#ef4444", min: 81, max: 100 }
      ];

      function getVesselCategory(v) {
        if (v.threatType && v.threatType !== "Normal" && v.threatType !== "Normal Transit") {
          return v.threatType;
        }
        const score = v.riskScore ?? v.risk ?? 0;
        if (score >= 80) return "Dark Activity / Smuggling";
        if (score >= 70) return "Border Intrusion";
        if (score >= 50) return "Suspicious Loitering";
        if (score >= 35) return "Anomalous Behavior";
        return "Normal Transit";
      }

      function getVesselRiskTier(v) {
        const score = v.riskScore ?? v.risk ?? 0;
        if (score > 80) return "critical";
        if (score > 60) return "high";
        if (score > 40) return "elevated";
        return "low";
      }

      function buildDonutSvg(categories, totalCount) {
        if (!totalCount || categories.length === 0) {
          return `
            <svg width="220" height="220" viewBox="0 0 220 220" style="overflow: visible;">
              <circle cx="110" cy="110" r="75" fill="none" stroke="#334155" stroke-width="26" opacity="0.3" />
            </svg>
          `;
        }

        let currentOffset = 0;
        const slicesHtml = categories.map((cat, idx) => {
          const fraction = cat.count / totalCount;
          const dash = Math.max(2, Math.round(fraction * 471));
          const offset = currentOffset;
          currentOffset += dash;

          const isHovered = analyticsHoveredCategory === cat.name;
          const isSelected = analyticsCategoryFilter === cat.name;
          const isDimmed = (analyticsHoveredCategory && !isHovered) || (analyticsCategoryFilter && !isSelected);

          const strokeWidth = isHovered ? 34 : (isSelected ? 32 : 26);
          const strokeFilter = (isHovered || isSelected) ? `filter: drop-shadow(0 0 8px ${cat.color});` : '';
          const opacity = isDimmed ? 0.35 : 1;

          return `
            <circle
              id="donut-slice-${idx}"
              class="donut-slice-item"
              cx="110" cy="110" r="75"
              fill="none"
              stroke="${cat.color}"
              stroke-width="${strokeWidth}"
              stroke-dasharray="${dash} ${Math.max(0, 471 - dash)}"
              stroke-dashoffset="${-offset}"
              style="cursor: pointer; transition: stroke-width 0.2s ease, opacity 0.2s ease, filter 0.2s ease; opacity: ${opacity}; ${strokeFilter}"
              data-category="${cat.name}"
              onmouseenter="window.handleDonutHover('${cat.name}')"
              onmouseleave="window.handleDonutLeave()"
              onclick="window.toggleCategoryFilter('${cat.name}')"
            />
          `;
        }).join("");

        return `
          <svg width="220" height="220" viewBox="0 0 220 220" style="overflow: visible; transform: rotate(-90deg);">
            ${slicesHtml}
          </svg>
        `;
      }

      function buildDonutHud(categories, totalCount) {
        let title = "No Threats";
        let subtitle = "System Secure";
        let label = "PRIMARY THREAT";
        let color = "#10b981";

        if (analyticsHoveredCategory) {
          const hovered = categories.find(c => c.name === analyticsHoveredCategory);
          if (hovered) {
            label = "INSPECTING CATEGORY";
            title = `${hovered.name} : ${hovered.pct}%`;
            subtitle = `${hovered.count} of ${totalCount} targets`;
            color = hovered.color;
          }
        } else if (analyticsCategoryFilter) {
          const selected = categories.find(c => c.name === analyticsCategoryFilter);
          if (selected) {
            label = "ACTIVE FILTER";
            title = `${selected.name} : ${selected.pct}%`;
            subtitle = `${selected.count} targets · Click to clear`;
            color = selected.color;
          } else {
            label = "ACTIVE FILTER";
            title = analyticsCategoryFilter;
            subtitle = "Click to clear filter";
            color = THREAT_COLORS[analyticsCategoryFilter] || "#0284c7";
          }
        } else if (categories.length > 0) {
          const primary = categories.find(c => c.name !== "Normal Transit") || categories[0];
          label = "PRIMARY THREAT";
          title = `${primary.name} : ${primary.pct}%`;
          subtitle = `${primary.count} vessels detected`;
          color = primary.color;
        }

        return `
          <div id="analytics-donut-hud" style="background:#0f172a; border:1px solid ${color}66; color:#f8fafc; padding:8px 14px; border-radius:8px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.5); font-size:14px; font-weight:600; text-align:center; min-width:145px; pointer-events:none; transition: all 0.2s ease;">
            <div style="font-size:11px; color:#94a3b8; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:2px;">${label}</div>
            <div style="font-size:14px; font-weight:800; color:${color}; line-height:1.2;">${title}</div>
            <div style="font-size:11px; color:#cbd5e1; font-weight:500; margin-top:2px;">${subtitle}</div>
          </div>
        `;
      }

      function buildDonutLegend(categories) {
        if (!categories.length) return `<div style="text-align:center; font-size:13px; color:var(--text-muted); margin-top:14px;">No threat categories in current mode.</div>`;

        return `
          <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:8px 14px; margin-top:14px; font-size:12px;">
            ${categories.map(c => {
              const isSelected = analyticsCategoryFilter === c.name;
              const isHovered = analyticsHoveredCategory === c.name;
              return `
                <div
                  onclick="window.toggleCategoryFilter('${c.name}')"
                  onmouseenter="window.handleDonutHover('${c.name}')"
                  onmouseleave="window.handleDonutLeave()"
                  style="cursor:pointer; display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border-radius:6px; transition:all 0.15s ease; background:${isSelected ? 'var(--bg-card-subtle)' : isHovered ? 'var(--bg-card-subtle)' : 'transparent'}; border: 1px solid ${isSelected ? c.color : 'transparent'};"
                  title="Click to filter by ${c.name}"
                >
                  <strong style="color:${c.color}; font-size:13px;">■</strong>
                  <span style="color:${isSelected ? 'var(--text-primary)' : 'var(--text-muted)'}; font-weight:${isSelected ? '700' : '500'};">
                    ${c.name} (${c.pct}%)
                  </span>
                  <span class="badge badge-neutral" style="font-size:10px; padding:1px 5px;">${c.count}</span>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      function buildRiskBars(vessels) {
        const total = vessels.length || 1;
        return RISK_TIERS.map(tier => {
          const count = vessels.filter(v => {
            const score = v.riskScore ?? v.risk ?? 0;
            return score >= tier.min && score <= tier.max;
          }).length;
          const pct = Math.round((count / total) * 100);

          return `
            <div style="padding:8px 12px; border-radius:8px; margin-bottom:4px;">
              <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:5px;">
                <span style="font-weight:600; color:var(--text-primary); display:flex; align-items:center; gap:6px;">
                  • ${tier.label}
                </span>
                <div>
                  <strong style="color:${tier.color}; font-size:14px;">${count} vessels</strong>
                  <span style="font-size:11px; color:var(--text-muted); margin-left:4px;">(${pct}%)</span>
                </div>
              </div>
              <div class="risk-meter-bar" style="height:7px; background:rgba(255,255,255,0.06);">
                <div class="risk-meter-fill" style="width:${pct}%; background:${tier.color};"></div>
              </div>
            </div>
          `;
        }).join("");
      }

      function renderAnalyticsContent(container, s) {
        let targetVessels = s.vessels || [];
        if (analyticsMode === "threats") {
          const threats = targetVessels.filter(v => getVesselRiskTier(v) !== "low" || (v.threatType && v.threatType !== "Normal Transit" && v.threatType !== "Normal"));
          if (threats.length > 0) {
            targetVessels = threats;
          }
        }

        const catMap = {};
        targetVessels.forEach(v => {
          const cat = getVesselCategory(v);
          catMap[cat] = (catMap[cat] || 0) + 1;
        });

        const totalCategoryVessels = targetVessels.length || 1;
        const categories = Object.keys(catMap).map(name => {
          const count = catMap[name];
          const pct = Math.round((count / totalCategoryVessels) * 100);
          const color = THREAT_COLORS[name] || "#64748b";
          return { name, count, pct, color };
        }).sort((a, b) => b.count - a.count);

        window._lastAnalyticsCategories = categories;
        window._lastAnalyticsTotal = totalCategoryVessels;

        container.innerHTML = `
          <div class="section-header">
            <div>
              <h1 class="section-title">Analytics & Threat Forecast</h1>
              <p class="section-subtitle">Real-time threat distributions, dynamic fleet categorization, and predictive security metrics across the Bay of Bengal.</p>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="badge ${s.simRunning ? "badge-ok" : "badge-warn"}">
                ${s.simRunning ? "● Live Dynamic Sync" : "Sync Paused"}
              </span>
            </div>
          </div>

          <div class="grid-4" style="margin-bottom: 20px;">
            <div class="metric-card">
              <div class="metric-label">Total Incidents</div>
              <div class="metric-value mono-num">${s.incidents.length}</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Alerts Raised (24h)</div>
              <div class="metric-value mono-num">${s.alerts.length}</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Avg Response Time</div>
              <div class="metric-value mono-num" style="color:var(--secondary);">18 min</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Monitored Vessels</div>
              <div class="metric-value mono-num" style="color:var(--primary);">${(s.vessels || []).length}</div>
            </div>
          </div>

          <div class="grid-2">
            <!-- THREAT CATEGORY DISTRIBUTION PANEL -->
            <div class="panel">
              <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                <h2>Threat Category Distribution</h2>
                <div style="display:flex; gap:4px; background:var(--bg-card-subtle); padding:2px; border-radius:6px; border:1px solid var(--border-color);">
                  <button
                    class="btn btn-sm"
                    style="font-size:11px; padding:3px 9px; cursor:pointer; ${analyticsMode === 'threats' ? 'background:var(--primary); color:#fff; font-weight:700;' : 'background:transparent; color:var(--text-muted);'}"
                    onclick="window.setAnalyticsMode('threats')"
                    title="Break down only active threats"
                  >⚡ Active Threats</button>
                  <button
                    class="btn btn-sm"
                    style="font-size:11px; padding:3px 9px; cursor:pointer; ${analyticsMode === 'all' ? 'background:var(--primary); color:#fff; font-weight:700;' : 'background:transparent; color:var(--text-muted);'}"
                    onclick="window.setAnalyticsMode('all')"
                    title="Break down all vessels in fleet"
                  >🌐 Entire Fleet</button>
                </div>
              </div>
              <div class="panel-body" style="position: relative;">
                <div style="display:flex; justify-content:center; align-items:center; height:240px; position:relative;">
                  ${buildDonutSvg(categories, totalCategoryVessels)}
                  <div id="analytics-donut-hud-container" style="position:absolute; display:flex; justify-content:center; align-items:center;">
                    ${buildDonutHud(categories, totalCategoryVessels)}
                  </div>
                </div>

                ${buildDonutLegend(categories)}
              </div>
            </div>

            <!-- THREAT LEVEL DISTRIBUTION PANEL -->
            <div class="panel">
              <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Threat Level Distribution</h2>
              </div>
              <div class="panel-body" style="display:flex; flex-direction:column; justify-content:space-around; min-height: 280px;">
                ${buildRiskBars(s.vessels || [])}
              </div>
            </div>
          </div>
        `;
      }

      function updateAnalyticsView(s) {
        const container = document.getElementById("command-view-container");
        if (!container || currentTab !== "analytics") return;
        renderAnalyticsContent(container, s);
      }

      window.setAnalyticsMode = function(mode) {
        analyticsMode = mode;
        analyticsCategoryFilter = null;
        updateAnalyticsView(window.msStore.getState());
      };

      window.toggleCategoryFilter = function(catName) {
        if (analyticsCategoryFilter === catName) {
          analyticsCategoryFilter = null;
        } else {
          analyticsCategoryFilter = catName;
        }
        updateAnalyticsView(window.msStore.getState());
      };

      window.handleDonutHover = function(catName) {
        analyticsHoveredCategory = catName;
        const hudEl = document.getElementById("analytics-donut-hud-container");
        if (hudEl && window._lastAnalyticsCategories) {
          hudEl.innerHTML = buildDonutHud(window._lastAnalyticsCategories, window._lastAnalyticsTotal);
        }
        document.querySelectorAll(".donut-slice-item").forEach(el => {
          const cat = el.getAttribute("data-category");
          const isTarget = (cat === catName);
          el.style.opacity = isTarget ? "1" : "0.35";
          el.style.strokeWidth = isTarget ? "34" : "26";
        });
      };

      window.handleDonutLeave = function() {
        analyticsHoveredCategory = null;
        const hudEl = document.getElementById("analytics-donut-hud-container");
        if (hudEl && window._lastAnalyticsCategories) {
          hudEl.innerHTML = buildDonutHud(window._lastAnalyticsCategories, window._lastAnalyticsTotal);
        }
        document.querySelectorAll(".donut-slice-item").forEach(el => {
          const cat = el.getAttribute("data-category");
          const isSelected = (analyticsCategoryFilter === cat);
          el.style.opacity = (analyticsCategoryFilter && !isSelected) ? "0.35" : "1";
          el.style.strokeWidth = isSelected ? "32" : "26";
        });
      };

      window.locateVesselOnMap = function(vesselId) {
        renderTab("map");
        setTimeout(() => {
          window.openThreatDossier(vesselId);
        }, 300);
      };

      function renderTab(tab) {
        currentTab = tab || currentTab;
        const container = document.getElementById("command-view-container");
        const s = window.msStore.getState();

        if (tab === "overview") {
          const openAlerts = s.alerts.filter(a => {
            const isAssigned = a.status === "Assigned" && a.assignedTo && s.users.some(u => u.id === a.assignedTo && u.status === "active");
            return !isAssigned && a.status !== "Resolved" && a.status !== "False Alarm";
          });
          const critical = s.alerts.filter(a => a.severity === "Critical" && a.status !== "Resolved" && a.status !== "False Alarm");
          const activeInc = (s.incidents || []).filter(i => i.status !== "Closed");
          const highRiskVessels = s.vessels.filter(v => (v.riskScore ?? v.risk) >= 70).sort((a, b) => (b.riskScore ?? b.risk) - (a.riskScore ?? a.risk));

          container.innerHTML = `
            <div class="section-header">
              <div>
                <h1 class="section-title">Maritime Command Center</h1>
                <p class="section-subtitle">Bay of Bengal · Live tactical maritime picture, autonomous threat detection, and field assignment.</p>
              </div>
              <div style="display:flex; gap:8px;">
                <button class="btn btn-primary btn-sm" onclick="window.openIncidentModal()">+ Create Incident</button>
                <span class="badge ${s.simRunning ? "badge-ok" : "badge-warn"}">
                  ${s.simRunning ? "Live feed active" : "Feed paused"}
                </span>
              </div>
            </div>

            <div class="grid-4" style="margin-bottom: 20px;">
              <div class="metric-card">
                <div class="metric-label">Vessels Tracked</div>
                <div class="metric-value mono-num">${s.vessels.length}</div>
                <div class="metric-hint">${s.vessels.filter(v => v.ais === 'lost').length} AIS lost</div>
              </div>
              <div class="metric-card">
                <div class="metric-label">Open Alerts</div>
                <div class="metric-value mono-num" style="color: var(--status-warn);">${openAlerts.length}</div>
                <div class="metric-hint">Awaiting confirmation</div>

                        const severity = score >= 80 ? "Critical" : score >= 70 ? "High" : score >= 35 ? "Medium" : "Low";
                        const rawBehaviors = [...(a.behaviours || []), ...(v.behaviours || []), ...(v.reasons || [])];

                        if (level === "HIGH") {
                          const exists = combinedAlerts.some(a => a.vesselId === v.id || a.vesselId === v.vesselId || a.vesselName === v.name);

                            const threatType = v.threatType || "High Threat Intrusion";

                            const behaviours = Array.from(new Set([...(v.behaviours || []), ...(v.reasons || [])].map(cleanReason).filter(Boolean)));

                            `}

      });

      // Smooth state subscriber (prevents destroying & re-creating the map DOM on simulation ticks)
      window.msStore.subscribe((s) => {
        // Dynamic analytics update
        if (currentTab === "analytics") {
          updateAnalyticsView(s);
        }
      });

      window.MS_UI.attachLayoutEvents(renderTab);
      renderTab("overview");
    });
  </script>
</body>
</html>
