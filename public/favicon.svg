<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background badge -->
  <rect width="64" height="64" rx="14" fill="#0a192f"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Radar pulse circle -->
  <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="10" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Anchor icon -->
  <!-- Top ring -->
  <circle cx="32" cy="18" r="4.5" stroke="#f0f9ff" stroke-width="2.5"/>
  <!-- Crossbar -->
  <line x1="20" y1="27" x2="44" y2="27" stroke="#f0f9ff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="20" cy="27" r="1.5" fill="#38bdf8"/>
  <circle cx="44" cy="27" r="1.5" fill="#38bdf8"/>
  <!-- Vertical shaft -->
  <line x1="32" y1="22" x2="32" y2="48" stroke="#f0f9ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Curved bottom fluke -->
  <path d="M16 35 C16 48, 48 48, 48 35" stroke="#f0f9ff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Fluke arrow tips -->
  <path d="M14 36 L17 31 L20 37 Z" fill="#38bdf8"/>
  <path d="M50 36 L47 31 L44 37 Z" fill="#38bdf8"/>
  <!-- Center bottom keel -->
  <circle cx="32" cy="48" r="1.5" fill="#f0f9ff"/>
</svg>
