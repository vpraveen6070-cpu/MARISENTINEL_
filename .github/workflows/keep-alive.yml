name: Keep Render Backend Alive

on:
  schedule:
    # Ping every 14 minutes to keep Render free-tier container warm (15m inactivity threshold)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to Render API
        run: |
          echo "Pinging https://marisentinel-api.onrender.com/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://marisentinel-api.onrender.com/health)
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✓ Render backend is online and active."
          else
            echo "⚠ Unexpected status $HTTP_STATUS, retrying..."
            sleep 5
            curl -f -s --max-time 45 https://marisentinel-api.onrender.com/health
          fi
